; Interstate '76 — dgVoodoo2 config for REAL WINDOWS (not the Mac/DXVK path;
; that one is dgVoodoo.conf). Deployed into the game folder by setup-windows.ps1.
;
; Grounded in docs/WINDOWS-PLAYBOOK.md + the live-tested config from
; docs/WHAT-THIS-IS-dgvoodoo.txt, updated for dgVoodoo 2.87.x option names.
; Load-bearing lines are marked; everything else is taste.

Version                              = 0x287

[General]
OutputAPI                            = d3d11_fl10_1
; Windowed is the verified default: a centered 1920x1440 titled window, menus
; and sim both correct 4:3. dgVoodoo fullscreen mode-switches to the nearest
; mode the display actually has (wrong aspect if it lacks a 4:3-friendly one),
; so for a fullscreen look prefer Lossless Scaling's overlay (Ctrl+Alt+S) —
; aspect-correct and adds LSFG frame gen. Windowed "fullscreensize" stretches
; (ignores ScalingMode).
FullScreenMode                       = false
ScalingMode                          = centered_ar
KeepWindowAspectRatio                = true
CenterAppWindow                      = true

[GeneralExt]
; THE physics fix (belt-and-braces: the GOG 2019 exe's I76PATCH.DLL already
; caps at 20). Never raise above ~25 — sim advances per rendered frame.
FPSLimit                             = 20
Resampling                           = bilinear

[Glide]
; Voodoo 1 with 2MB TMU — LOAD-BEARING. I76's Glide backend was written for
; 2MB-TMU cards; more TMU memory = texture panics/corruption after explosions
; (VOGONS t=70951).
VideoCard                           = voodoo_graphics
OnboardRAM                          = 2
MemorySizeOfTMU                     = 2048
NumberOfTMUs                        = 1
TMUFiltering                        = bilinear
; 3x = 1920x1440 (game renders 640x480). On a 1440-high display this is the
; exact integer fit. Other displays: "2x", "max_isf", or "2560x1920".
Resolution                          = 3x
Antialiasing                        = 8x
; The bright 3dfx look.
EnableGlideGammaRamp                = true
ForceEmulatingTruePCIAccess         = true
; false so Lossless Scaling frame-gen owns presentation (WINDOWS-PLAYBOOK.md sec 2);
; set true if not using LS and you see tearing.
ForceVerticalSync                   = false
3DfxWatermark                       = false
3DfxSplashScreen                    = false
; Keep the sim running when the window loses focus.
EnableInactiveAppState              = true

[DirectX]
; The 2D shell (menus, cutscenes, PLEASE STAND BY) is DirectDraw, not Glide.
; With dgVoodoo's DDraw.dll + D3DImm.dll in the game dir, it gets the same 3x
; upscale (640x480 -> 1920x1440, integer = crisp) instead of a tiny 640x480
; window. Also stops the boot phase from being a fullscreen-size popup.
VideoCard                           = internal3D
VRAM                                = 256
Resolution                          = 3x
dgVoodooWatermark                   = false
AppControlledScreenMode             = false
DisableAltEnterToToggleScreenMode   = true  ; dgVoodoo factory default
